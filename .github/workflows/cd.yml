name: CD — Execução da Oficina

# Build/push da imagem (GHCR) e deploy automatizado no Kubernetes.
# Dispara apenas em push na main (após o merge do PR aprovado pelo CI).
#
# GitHub Secrets necessários para o deploy:
#   KUBE_CONFIG                    — kubeconfig (base64 ou texto) do cluster alvo
#   MONGO_INITDB_ROOT_USERNAME     — usuário root do MongoDB
#   MONGO_INITDB_ROOT_PASSWORD     — senha root do MongoDB
#   MONGODB_URI                    — URI de conexão (com credenciais)
# Se KUBE_CONFIG não estiver configurado, o job de deploy é pulado (sem falhar).

on:
  push:
    branches:
      - main

env:
  K8S_NAMESPACE: auto-center-execucao

jobs:
  docker-build-push:
    name: 🐳 Build e Push da Imagem (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir nome da imagem (lowercase) e tag
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}" >> "${GITHUB_OUTPUT}"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Docker
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build -f docker/Dockerfile \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

  deploy:
    name: 🚀 Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-push
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aviso se kubeconfig ausente
        if: ${{ env.KUBE_CONFIG == '' }}
        run: echo "ℹ️  Secret KUBE_CONFIG não configurado — pulando o deploy no cluster."

      - name: Configurar kubeconfig
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          mkdir -p "${HOME}/.kube"
          # Aceita kubeconfig em base64 ou texto puro
          if echo "${KUBE_CONFIG}" | base64 -d >/dev/null 2>&1; then
            echo "${KUBE_CONFIG}" | base64 -d > "${HOME}/.kube/config"
          else
            echo "${KUBE_CONFIG}" > "${HOME}/.kube/config"
          fi
          chmod 600 "${HOME}/.kube/config"
          kubectl config current-context

      - name: Namespace e ConfigMap
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      - name: Criar/atualizar Secret do serviço
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          kubectl create secret generic execucao-secrets \
            --namespace="${K8S_NAMESPACE}" \
            --from-literal=MONGO_INITDB_ROOT_USERNAME="${{ secrets.MONGO_INITDB_ROOT_USERNAME }}" \
            --from-literal=MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}" \
            --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            --save-config --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifestos (Kustomize)
        if: ${{ env.KUBE_CONFIG != '' }}
        run: kubectl apply -k k8s/

      - name: Atualizar imagem da aplicação e aguardar rollout
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          kubectl -n "${K8S_NAMESPACE}" set image deployment/auto-center-execucao \
            auto-center-execucao="${{ needs.docker-build-push.outputs.image }}:${{ github.sha }}"
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/auto-center-execucao --timeout=300s

      - name: Status final
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          kubectl get pods,svc,hpa -n "${K8S_NAMESPACE}"
