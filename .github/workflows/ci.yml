name: CI — Execução da Oficina

# Build + testes (unitários, integração com Testcontainers e BDD) + qualidade (Sonar).
# Este workflow é o check obrigatório para merge na main (branch protegida).
#
# GitHub Secrets opcionais (para a análise Sonar):
#   SONAR_TOKEN     — token do SonarQube/SonarCloud
#   SONAR_HOST_URL  — URL do servidor Sonar (ex.: https://sonarcloud.io)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: 🔨 Build, Testes e Qualidade
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo melhora a análise do Sonar

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build e testes (Maven + JaCoCo)
        # O runner ubuntu-latest tem Docker: os testes de integração/BDD
        # com Testcontainers (Mongo + Kafka) rodam normalmente.
        run: mvn -B --no-transfer-progress clean verify

      - name: Análise de qualidade (SonarQube)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B --no-transfer-progress sonar:sonar
          -Dsonar.host.url="${SONAR_HOST_URL}"
          -Dsonar.token="${SONAR_TOKEN}"

      - name: Publicar relatório de testes (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
