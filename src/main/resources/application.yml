spring:
  application:
    name: auto-center-execucao
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/execucao}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: execucao-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Consumimos o JSON cru e roteamos por 'tipo' no envelope.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8098}

# Cadastro Service (catalogo de servicos e produtos)
cadastro:
  url: ${CADASTRO_URL:http://localhost:8097}

sistema:
  seguranca:
    chave:
      secreta: ${SISTEMA_SEGURANCA_CHAVE_SECRETA}

# ========================================
# Topicos Kafka do ecossistema (contrato da Saga)
# ========================================
execucao:
  kafka:
    topics:
      # consumidos
      os-eventos: os.eventos
      execucao-comandos: execucao.comandos
      # publicado
      execucao-eventos: execucao.eventos

# ========================================
# Swagger / OpenAPI
# ========================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ========================================
# Actuator (Health & Prometheus)
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/execucao

---
spring:
  config:
    activate:
      on-profile: prod
