apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: auto-center-execucao
  labels:
    app: mongodb
    component: database
spec:
  # Headless service: necessário para o StatefulSet (DNS estável do pod)
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
