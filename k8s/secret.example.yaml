# TEMPLATE de exemplo. NAO versione o Secret real com valores de producao.
# No pipeline CI/CD, crie o Secret com:
#   kubectl create secret generic execucao-secrets -n auto-center-execucao \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=execucao \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD=<senha> \
#     --from-literal=MONGODB_URI="mongodb://execucao:<senha>@mongodb-service:27017/execucao?authSource=admin"
apiVersion: v1
kind: Secret
metadata:
  name: execucao-secrets
  namespace: auto-center-execucao
  labels:
    app: auto-center-execucao
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "execucao"
  MONGO_INITDB_ROOT_PASSWORD: "change-me"
  MONGODB_URI: "mongodb://execucao:change-me@mongodb-service:27017/execucao?authSource=admin"
