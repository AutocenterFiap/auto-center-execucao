apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-center-execucao
  namespace: auto-center-execucao
  labels:
    app: auto-center-execucao
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auto-center-execucao
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auto-center-execucao
        component: api
      annotations:
        ad.datadoghq.com/auto-center-execucao.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "prometheus_url": "http://%%host%%:8098/actuator/prometheus",
                  "namespace": "autocenter_execucao",
                  "metrics": [
                    "autocenter_*"
                  ]
                }
              ]
            }
          }
        ad.datadoghq.com/auto-center-execucao.logs: |
          [
            {"source": "spring-boot", "service": "auto-center-execucao"}
          ]
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - "-c"
            - |
              until nc -z mongodb-service 27017; do
                echo "Aguardando MongoDB...";
                sleep 3;
              done;
              echo "MongoDB disponivel!"
      containers:
        - name: auto-center-execucao
          # Substitua pela imagem publicada no seu registry
          image: auto-center-execucao:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8098
              name: http
              protocol: TCP
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_ENV
              value: "prod"
            - name: DD_SERVICE
              value: "auto-center-execucao"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/dd-java-agent.jar"
            # ─── URI do MongoDB (com credenciais) via Secret ──────────
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: execucao-secrets
                  key: MONGODB_URI
            - name: SISTEMA_SEGURANCA_CHAVE_SECRETA
              valueFrom:
                secretKeyRef:
                  name: execucao-secrets
                  key: SISTEMA_SEGURANCA_CHAVE_SECRETA
          # ─── Variáveis não-sensíveis via ConfigMap ──────────────────
          envFrom:
            - configMapRef:
                name: execucao-configmap
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8098
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8098
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8098
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12   # Até 120s para a app inicializar
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - auto-center-execucao
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
